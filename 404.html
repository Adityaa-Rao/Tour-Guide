<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Lost Off The Map | Tourguide</title>
  <meta name="description" content="Oops! This destination doesn't exist on our map. Let Tourguide guide you back home.">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✈️</text></svg>">

  <!-- Fonts & CDN CSS -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Afacad+Flux:wght@300;400;600;700&family=Noto+Serif:ital,wght@0,400;0,700;1,400&family=Oxygen:wght@300;400;700&family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@3.2.0/fonts/remixicon.css">
  <link rel="stylesheet" href="styles.css">

  <style>
    .error-wrapper {
      min-height: calc(100vh - 140px);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px;
    }
    .error-code {
      font-size: 8rem;
      font-weight: 800;
      line-height: 1;
      background: linear-gradient(135deg, var(--primary-color), var(--btn-accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
    }
    .compass-animated {
      font-size: 5rem;
      color: var(--primary-color);
      display: inline-block;
      animation: spinCompass 6s ease-in-out infinite alternate;
      margin-bottom: 20px;
    }
    @keyframes spinCompass {
      0% { transform: rotate(-30deg); }
      50% { transform: rotate(180deg); }
      100% { transform: rotate(330deg); }
    }
  </style>
</head>
<body class="d-flex flex-column min-vh-100">

  <!-- Header -->
  <header class="header-wrapper sticky-top">
    <nav class="newNav container-fluid px-lg-5" id="mainNav">
      <div class="nav-container">
        <a href="index.html" class="nav__brand">
          <div class="brand-icon-wrap"><i class="fa-solid fa-earth-americas brand-globe"></i></div>
          <span class="nav__logo">Tourguide<span>.</span></span>
          <span class="brand-tag">Travel Dost</span>
        </a>
        <button id="themeToggle" class="theme-toggle-btn" aria-label="Toggle Theme"><i class="ri-moon-line moon-icon"></i><i class="ri-sun-line sun-icon"></i></button>
      </div>
    </nav>
  </header>

  <!-- 404 Main Body -->
  <main class="error-wrapper flex-grow-1">
    <div class="container">
      <div class="max-w-700 mx-auto">
        <div class="compass-animated"><i class="ri-compass-3-fill"></i></div>
        <div class="error-code">404</div>
        <h2 class="section-title mb-2">You've Wandered Off The Map!</h2>
        <p class="section-subtitle mb-4">
          The page or travel route you are looking for has either drifted away into the clouds, been renamed, or never existed in our atlas.
        </p>

        <div class="d-flex flex-wrap justify-content-center gap-3">
          <a href="index.html" class="btn btn-accent-coral px-4 py-2">
            <i class="ri-home-4-line me-1"></i> Return to Homepage
          </a>
          <a href="mapa.html" class="btn btn-outline-hero px-4 py-2">
            <i class="ri-map-2-line me-1"></i> Open Interactive Map
          </a>
          <a href="packages.html" class="btn btn-subtle-membership px-4 py-2">
            <i class="ri-suitcase-line me-1"></i> Browse Tour Packages
          </a>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer py-3 text-center border-top">
    <p class="mb-0 small text-muted">&copy; 2026 Tourguide. Lost but always guided.</p>
  </footer>

  <script src="Theme.js"></script>
</body>
</html>
