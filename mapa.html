  <style>
    .map-page-wrapper {
      position: relative;
      height: calc(100vh - 72px);
      display: flex;
    }

    #destMap {
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    .map-sidebar-floating {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 1000;
      width: 380px;
      max-height: calc(100% - 32px);
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.22);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      backdrop-filter: blur(12px);
    }

    .map-sidebar-header {
      padding: 16px 18px 12px;
      border-bottom: 1px solid var(--card-border);
    }

    .map-category-pills-bar {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding: 8px 18px;
      border-bottom: 1px solid var(--card-border);
      background: var(--secondary-color);
      scrollbar-width: none;
    }
    .map-category-pills-bar::-webkit-scrollbar {
      display: none;
    }

    .sidebar-cat-pill {
      border: 1px solid var(--card-border);
      background: var(--card-bg);
      color: var(--text-dark);
      padding: 4px 11px;
      border-radius: 50px;
      font-size: 0.78rem;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .sidebar-cat-pill:hover,
    .sidebar-cat-pill.active {
      background: var(--primary-color);
      color: #fff;
      border-color: var(--primary-color);
    }

    .map-dest-list {
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1;
    }

    .map-dest-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 9px 12px;
      border-radius: 14px;
      background: var(--secondary-color);
      border: 1px solid var(--card-border);
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .map-dest-item:hover,
    .map-dest-item.active {
      transform: translateX(4px);
      border-color: var(--primary-color);
      background: var(--primary-light);
      box-shadow: 0 4px 14px rgba(54, 133, 251, 0.15);
    }

    .map-dest-thumb {
      width: 52px;
      height: 52px;
      border-radius: 10px;
      object-fit: cover;
      flex-shrink: 0;
    }

    .map-controls-floating {
      position: absolute;
      top: 16px;
      right: 16px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .map-tool-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--card-bg);
      color: var(--text-dark);
      border: 1px solid var(--card-border);
      box-shadow: 0 6px 18px rgba(0,0,0,0.18);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.15rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .map-tool-btn:hover {
      background: var(--primary-color);
      color: #ffffff;
      transform: translateY(-2px);
    }

    /* Custom Leaflet Popup Styling */
    .leaflet-popup-content-wrapper {
      border-radius: 18px;
      padding: 0;
      overflow: hidden;
      background: var(--card-bg);
      color: var(--text-dark);
      box-shadow: 0 16px 36px rgba(0,0,0,0.28);
      border: 1px solid var(--card-border);
    }

    .leaflet-popup-content {
      margin: 0;
      width: 290px !important;
    }

    .popup-img {
      width: 100%;
      height: 140px;
      object-fit: cover;
    }

    .popup-body {
      padding: 14px 16px;
    }

    .popup-badge {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 50px;
      background: rgba(54, 133, 251, 0.15);
      color: var(--primary-color);
      margin-bottom: 6px;
    }

    .popup-title {
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 4px;
      color: var(--text-dark);
    }

    .popup-desc {
      font-size: 0.8rem;
      color: var(--text-light);
      line-height: 1.4;
      margin-bottom: 10px;
    }

    .popup-price {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--primary-color);
    }

    @media (max-width: 991px) {
      .map-sidebar-floating {
        position: static;
        width: 100%;
        max-height: 280px;
        border-radius: 0;
      }
      .map-page-wrapper {
        flex-direction: column;
        height: auto;
      }
      #destMap {
        height: 60vh;
      }
      .map-controls-floating {
        top: auto;
        bottom: 20px;
        right: 20px;
      }

        <p class="small text-muted mb-2" style="font-size: 0.8rem;">Search any mall, city, or landmark globally or click below to fly to it.</p>

          badge: "Infinity Pool",
          img: "https://images.unsplash.com/photo-1525625293386-3f8f99389edd?auto=format&fit=crop&w=600&q=80",
          desc: "Futuristic 3-tower luxury resort crowned by the Sands SkyPark, boasting the world's longest elevated infinity pool and premier shopping canal.",
          price: 490
        }
      ];

      // Initialize Leaflet Map
      const map = L.map('destMap', {
        center: [25.0, 20.0],
        zoom: 3,
        minZoom: 2,
        maxZoom: 18,
        zoomControl: true
      });

      const streetLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors | Travel Dost',
        maxZoom: 19
      }).addTo(map);

      const satelliteLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
        attribution: 'Tiles &copy; Esri &mdash; Travel Dost World Satellite',
        maxZoom: 18
      });

      let isSatellite = false;
      const btnToggleLayers = document.getElementById('btnToggleLayers');
      if (btnToggleLayers) {
        btnToggleLayers.addEventListener('click', () => {
          if (!isSatellite) {
            map.removeLayer(streetLayer);
            satelliteLayer.addTo(map);
            isSatellite = true;
            btnToggleLayers.innerHTML = '<i class="ri-map-2-line"></i>';
            btnToggleLayers.setAttribute('title', 'Switch to Street View');
          } else {
            map.removeLayer(satelliteLayer);
            streetLayer.addTo(map);
            isSatellite = false;
            btnToggleLayers.innerHTML = '<i class="ri-earth-line"></i>';
            btnToggleLayers.setAttribute('title', 'Switch to Satellite View');
          }
        });
      }

      const btnResetMapView = document.getElementById('btnResetMapView');
      if (btnResetMapView) {
        btnResetMapView.addEventListener('click', () => {
          map.flyTo([25.0, 20.0], 3, { animate: true, duration: 1.5 });
        });
      }

      // Marker management
      let markersGroup = L.layerGroup().addTo(map);
      let currentActiveCat = 'all';
      let searchResultMarker = null;

      function createCustomIcon(type) {
        let iconHtml = '<i class="ri-map-pin-fill"></i>';
        let bgClass = 'style="background: linear-gradient(135deg, #3685fb, #6a5acd);"';

        if (type === 'mall') {
          iconHtml = '<i class="ri-shopping-bag-3-fill"></i>';
          bgClass = 'style="background: linear-gradient(135deg, #ff4757, #ff6b81);"';
        } else if (type === 'wonder') {
          iconHtml = '<i class="ri-ancient-gate-fill"></i>';
          bgClass = 'style="background: linear-gradient(135deg, #6a5acd, #3685fb);"';
        } else if (type === 'beach') {
          iconHtml = '<i class="ri-sun-fill"></i>';
          bgClass = 'style="background: linear-gradient(135deg, #ffa502, #ff7f50);"';
        } else if (type === 'nature') {
          iconHtml = '<i class="ri-mountain-fill"></i>';
          bgClass = 'style="background: linear-gradient(135deg, #2ed573, #1e90ff);"';
        } else if (type === 'luxury') {
          iconHtml = '<i class="ri-hotel-bed-fill"></i>';
          bgClass = 'style="background: linear-gradient(135deg, #9b59b6, #e056fd);"';
        }

        return L.divIcon({
          className: 'custom-map-leaflet-pin',
          html: `<div class="map-pin-pulse-wrapper" ${bgClass}>${iconHtml}</div>`,
          iconSize: [38, 38],
          iconAnchor: [19, 38],
          popupAnchor: [0, -38]
        });
      }

      const listContainer = document.getElementById('mapDestList');
      const countBadge = document.getElementById('sidebarCountBadge');

      function renderPlaces(filterCat = 'all', searchQuery = '') {
        markersGroup.clearLayers();
        listContainer.innerHTML = '';

        const filtered = mapDatabase.filter(item => {
          const catMatches = filterCat === 'all' || item.type === filterCat;
          const searchMatches = !searchQuery || 
            item.name.toLowerCase().includes(searchQuery) ||
            item.city.toLowerCase().includes(searchQuery) ||
            item.country.toLowerCase().includes(searchQuery) ||
            item.categoryName.toLowerCase().includes(searchQuery);
          return catMatches && searchMatches;
        });

        if (countBadge) {
          countBadge.textContent = `${filtered.length} Places`;
        }

        if (filtered.length === 0) {
          listContainer.innerHTML = `
            <div class="text-center py-4 px-2 text-muted">
              <i class="ri-search-eye-line display-6 mb-2 d-block text-secondary"></i>
              <p class="small mb-1">No local places found in this filter.</p>
              <button class="btn btn-sm btn-outline-primary mt-2" id="btnGeocodeTry">Search entire world map</button>
            </div>
          `;
          const btnGeo = document.getElementById('btnGeocodeTry');
          if (btnGeo) {
            btnGeo.addEventListener('click', () => {
              executeGlobalGeocoding(searchQuery);
            });
          }
          return;
        }

        filtered.forEach(place => {
          const marker = L.marker(place.coords, {
            icon: createCustomIcon(place.type)
          }).addTo(markersGroup);

          const popupHtml = `
            <div>
              <img src="${place.img}" class="popup-img" alt="${place.name}">
              <div class="popup-body">
                <span class="popup-badge">${place.badge} &bull; ${place.city}, ${place.country}</span>
                <h6 class="popup-title">${place.name}</h6>
                <p class="popup-desc">${place.desc}</p>
                <div class="d-flex justify-content-between align-items-center border-top pt-2">
                  <span class="popup-price">${place.price > 0 ? '$' + place.price : 'Free Entry'}</span>
                  <a href="payment.html?dest=${encodeURIComponent(place.name)}&price=${place.price || 499}" class="btn btn-sm btn-accent-coral rounded-pill px-3">
                    <i class="ri-flashlight-line me-1"></i>Book
                  </a>
                </div>
              </div>
            </div>
          `;

          marker.bindPopup(popupHtml);

          const itemEl = document.createElement('div');
          itemEl.className = 'map-dest-item';
          itemEl.innerHTML = `
            <img src="${place.img}" class="map-dest-thumb" alt="${place.name}">
            <div style="flex-grow: 1; min-width: 0;">
              <div class="d-flex justify-content-between align-items-center mb-1">
                <strong class="small text-truncate d-block" style="color: var(--text-dark);">${place.name}</strong>
                <span class="small fw-bold text-primary">${place.price > 0 ? '$' + place.price : 'Free'}</span>
              </div>
              <div class="d-flex align-items-center justify-content-between">
                <small class="text-muted text-truncate" style="font-size: 0.75rem;">${place.city}, ${place.country}</small>
                <span class="small text-warning fw-bold"><i class="fa-solid fa-star"></i> ${place.rating}</span>
              </div>
            </div>
          `;

          itemEl.addEventListener('click', () => {
            document.querySelectorAll('.map-dest-item').forEach(el => el.classList.remove('active'));
            itemEl.classList.add('active');

            map.flyTo(place.coords, 10, {
              animate: true,
              duration: 1.5
            });

            setTimeout(() => {
              marker.openPopup();
            }, 1500);
          });

          listContainer.appendChild(itemEl);
        });
      }

      // Initial render
      renderPlaces('all');

      // Category Pill Click
      const catPills = document.querySelectorAll('.sidebar-cat-pill');
      catPills.forEach(pill => {
        pill.addEventListener('click', () => {
          catPills.forEach(p => p.classList.remove('active'));
          pill.classList.add('active');
          currentActiveCat = pill.getAttribute('data-cat') || 'all';
          const query = (document.getElementById('mapSearchInput').value || '').toLowerCase().trim();
          renderPlaces(currentActiveCat, query);
        });
      });

      // Search Handler
      const searchInput = document.getElementById('mapSearchInput');
      const searchBtn = document.getElementById('btnMapSearch');

      if (searchInput) {
        searchInput.addEventListener('input', (e) => {
          const query = e.target.value.toLowerCase().trim();
          renderPlaces(currentActiveCat, query);
        });

        searchInput.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') {
            e.preventDefault();
            const query = searchInput.value.trim();
            if (query) {
              executeGlobalGeocoding(query);
            }
          }
        });
      }

      if (searchBtn) {
        searchBtn.addEventListener('click', () => {
          const query = searchInput.value.trim();
          if (query) {
            executeGlobalGeocoding(query);
          }
        });
      }

      // Live World Geocoding via OpenStreetMap Nominatim
      async function executeGlobalGeocoding(query) {
        if (!query) return;

        // Check if there is a match in mapDatabase first
        const localMatch = mapDatabase.find(p => 
          p.name.toLowerCase().includes(query.toLowerCase()) || 
          p.city.toLowerCase().includes(query.toLowerCase()) ||
          p.country.toLowerCase().includes(query.toLowerCase())
        );

        if (localMatch) {
          map.flyTo(localMatch.coords, 11, { animate: true, duration: 1.6 });
          renderPlaces(localMatch.type, '');
          setTimeout(() => {
            markersGroup.eachLayer(layer => {
              const latLng = layer.getLatLng();
              if (Math.abs(latLng.lat - localMatch.coords[0]) < 0.01 && Math.abs(latLng.lng - localMatch.coords[1]) < 0.01) {
                layer.openPopup();
              }
            });
          }, 1600);
          return;
        }

        // Live OpenStreetMap Geocoding Fallback
        try {
          if (searchBtn) searchBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';

          const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(query)}`);
          const data = await res.json();

          if (data && data.length > 0) {
            const result = data[0];
            const lat = parseFloat(result.lat);
            const lon = parseFloat(result.lon);

            if (searchResultMarker) {
              map.removeLayer(searchResultMarker);
            }

            const searchIcon = L.divIcon({
              className: 'custom-map-leaflet-pin',
              html: `<div class="map-pin-pulse-wrapper" style="background: linear-gradient(135deg, #ff4757, #ff6b81);"><i class="ri-search-2-line"></i></div>`,
              iconSize: [40, 40],
              iconAnchor: [20, 40],
              popupAnchor: [0, -40]
            });

            searchResultMarker = L.marker([lat, lon], { icon: searchIcon }).addTo(map);

            const dynamicPopup = `
              <div>
                <img src="https://images.unsplash.com/photo-1488646953014-85cb44e25828?auto=format&fit=crop&w=600&q=80" class="popup-img" alt="${result.display_name}">
                <div class="popup-body">
                  <span class="popup-badge">Found on Global Map</span>
                  <h6 class="popup-title">${result.name || query}</h6>
                  <p class="popup-desc">${result.display_name}</p>
                  <div class="d-flex justify-content-between align-items-center border-top pt-2">
                    <span class="popup-price">$699 <small class="text-muted fw-normal" style="font-size:0.75rem;">est. package</small></span>
                    <a href="payment.html?dest=${encodeURIComponent(result.name || query)}&price=699" class="btn btn-sm btn-accent-coral rounded-pill px-3">
                      Book Trip
                    </a>
                  </div>
                </div>
              </div>
            `;

            searchResultMarker.bindPopup(dynamicPopup).openPopup();
            map.flyTo([lat, lon], 12, { animate: true, duration: 1.8 });

            // Also prepend to list
            const foundItem = document.createElement('div');
            foundItem.className = 'map-dest-item active';
            foundItem.innerHTML = `
              <div class="map-dest-thumb d-flex align-items-center justify-content-center bg-primary text-white rounded-3" style="width: 52px; height: 52px;">
                <i class="ri-map-pin-fill fs-5"></i>
              </div>
              <div style="flex-grow: 1; min-width: 0;">
                <strong class="small text-truncate d-block" style="color: var(--text-dark);">${result.name || query}</strong>
                <small class="text-muted text-truncate d-block" style="font-size: 0.72rem;">${result.display_name}</small>
              </div>
            `;
            listContainer.prepend(foundItem);
          } else {
            alert(`Could not find "${query}" on the map. Please try a different city, mall, or landmark name.`);
          }
        } catch (err) {
          console.error("Geocoding error:", err);
        } finally {
          if (searchBtn) searchBtn.innerHTML = '<i class="ri-arrow-right-line"></i>';
        }
      }
    });
  </script>
</body>
</html>
